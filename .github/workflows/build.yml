name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 项目目标框架是 net10.0-windows，必须是 .NET 10 SDK
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore DeskFlow.sln

      - name: Build
        run: dotnet build DeskFlow.sln --configuration Release --no-restore

      # 自检不是 xunit，直接跑控制台检查程序（非 0 退出即失败）
      - name: Self checks
        run: dotnet run --project tests/DeskFlow.Checks --configuration Release --no-build

      # 单文件自包含发布（与本地 build/pack.ps1 参数一致）
      - name: Publish single-file exe
        run: >
          dotnet publish src/DeskFlow.App/DeskFlow.App.csproj
          -c Release
          -r win-x64
          --self-contained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:SatelliteResourceLanguages=en
          -o dist

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = 'dist/TidyFlow.exe'
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          "产物: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Upload TidyFlow.exe
        uses: actions/upload-artifact@v4
        with:
          name: TidyFlow-win-x64
          path: dist/TidyFlow.exe
          if-no-files-found: error
